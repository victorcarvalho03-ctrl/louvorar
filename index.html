<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Escalas - Área Angra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="container-login">
        <h1>Acesso Restrito</h1>
        <p>Área Angra dos Reis</p>
        <input type="email" id="email" placeholder="E-mail" autocomplete="email">
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
        <button onclick="fazerLogin()">Entrar</button>
        <p id="mensagem-erro" class="erro"></p>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="painel-principal" class="escondido">
        <header class="topo-amarelo">
            <h2>SISTEMA DE ESCALAS E ESTRUTURAS</h2>
            <button onclick="fazerLogout()" class="btn-sair">Sair</button>
        </header>

        <nav class="menu-abas">
            <button id="aba-btn-membros" class="aba-ativa" onclick="mostrarAba('membros')">Gestão de Membros</button>
            <button id="aba-btn-eventos" onclick="mostrarAba('eventos')">Eventos</button>
            <button onclick="alert('Em breve!')">Montar Estrutura</button>
        </nav>

        <main id="conteudo-membros" class="conteudo">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h3>Membros Cadastrados</h3>
                <!-- O botão só aparece se o JS autorizar -->
                <button id="btn-add-membro" class="btn-adicionar" onclick="abrirModal()" style="display: none;">+ Adicionar Membro</button>
            </div>

            <!-- SUB-ABAS -->
            <div class="sub-abas">
                <button id="sub-aba-locais" class="btn-sub-aba ativa" onclick="mudarSubAba('locais')">Grupos Locais</button>
                <button id="sub-aba-area" class="btn-sub-aba" onclick="mudarSubAba('area')">Grupo de Área</button>
            </div>
            
            <!-- Tabela com rolagem lateral para celular -->
            <div class="tabela-responsiva">
                <table class="tabela-dados">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Grupo Local</th>
                            <th>Funções</th>
                            <th>Grupo de Área</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela-membros">
                        <tr><td colspan="5" style="text-align:center;">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
                <!-- CONTEÚDO DE EVENTOS -->
        <main id="conteudo-eventos" class="conteudo escondido">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h3>Eventos Cadastrados</h3>
                <button class="btn-adicionar" onclick="abrirModalEvento()">+ Criar Novo Evento</button>
            </div>
            
            <div class="tabela-responsiva">
                <table class="tabela-dados">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Data</th>
                            <th>Prazo de Resposta</th>
                            <th>Link de Disponibilidade</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela-eventos">
                        <tr><td colspan="4" style="text-align:center;">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL DE CADASTRO/EDIÇÃO -->
    <div id="modal-membro" class="modal-fundo escondido">
        <div class="modal-conteudo">
            <h3 id="titulo-modal-membro">Cadastrar Novo Membro</h3>
            
            <label>Nome Completo:</label>
            <input type="text" id="membro-nome" placeholder="Ex: Ana Maria">

            <label>Grupo Local:</label>
            <select id="membro-grupo">
                <option value="Frade">Frade</option>
                <option value="Perequê">Perequê</option>
                <option value="Campo da Gringa">Campo da Gringa</option>
                <option value="Itinga">Itinga</option>
                <option value="Nova Angra">Nova Angra</option>
                <option value="Jacuecanga">Jacuecanga</option>
                <option value="Lídice">Lídice</option>
            </select>

            <label>Funções (Voz/Instrumento):</label>
            <input type="text" id="membro-funcoes" placeholder="Ex: Soprano, Teclado (separe por vírgula)">

            <label style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
                <input type="checkbox" id="membro-area" style="width: auto;"> 
                Faz parte do Grupo de Área?
            </label>

            <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-salvar" onclick="salvarMembro()">Salvar</button>
            </div>
        </div>
    </div>

        <!-- MODAL DE EVENTO -->
    <div id="modal-evento" class="modal-fundo escondido">
        <div class="modal-conteudo">
            <h3>Novo Evento</h3>
            
            <label>Título do Evento:</label>
            <input type="text" id="evento-titulo" placeholder="Ex: Vigília Nova Angra">

            <label>Data do Evento:</label>
            <input type="date" id="evento-data">

            <label>Prazo para Respostas (Data e Hora):</label>
            <input type="datetime-local" id="evento-prazo">

            <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModalEvento()">Cancelar</button>
                <button class="btn-salvar" onclick="salvarEvento()">Salvar</button>
            </div>
        </div>
    </div>
    
    <!-- Scripts do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
