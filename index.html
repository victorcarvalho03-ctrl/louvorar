<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Escalas - Área Angra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="container-login">
        <h1>Acesso Restrito</h1>
        <p>Área Angra dos Reis</p>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
        <p id="mensagem-erro" class="erro"></p>
    </div>

    <!-- PAINEL PRINCIPAL (Escondido até fazer login) -->
    <div id="painel-principal" class="escondido">
        <header class="topo-amarelo">
            <h2>SISTEMA DE ESCALAS E ESTRUTURAS</h2>
            <button onclick="fazerLogout()" class="btn-sair">Sair</button>
        </header>

        <nav class="menu-abas">
            <button class="aba-ativa" onclick="mostrarAba('membros')">Gestão de Membros</button>
            <button onclick="alert('Em breve!')">Eventos</button>
            <button onclick="alert('Em breve!')">Montar Estrutura</button>
        </nav>

        <main id="conteudo-membros" class="conteudo">
            <h3>Membros Cadastrados</h3>
            <button class="btn-adicionar" onclick="alert('Em breve: Abrir modal de cadastro')">+ Adicionar Novo Membro</button>
            
            <table class="tabela-dados">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Grupo Local</th>
                        <th>Funções</th>
                        <th>Grupo de Área</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-membros">
                    <!-- Os dados do Firebase vão aparecer aqui -->
                    <tr>
                        <td colspan="5" style="text-align:center;">Carregando dados...</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <!-- Scripts do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Seu script -->
    <script src="app.js"></script>
</body>
</html>
